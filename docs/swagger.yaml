paths:
  /logs/content:
    get:
      consumes:
      - application/json
      description: get log content
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Log'
        "400":
          description: success
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  type: object
              type: object
        "404":
          description: somthing is wrong
          schema:
            $ref: '#/definitions/controller.Response'
      summary: Get logs content
      tags:
      - logs
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
